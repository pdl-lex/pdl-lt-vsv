[project]
name = "pipeline"
version = "0.1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "marimo>=0.24.0",
    "polars>=1.44.1",
    "numpy>=2.0",
    "spacy>=3.8.16",
    "de-core-news-md",
    # SGNS-Pfad (pipeline-sgns.py). Wheels gibt es bis cp313 - das ist der
    # Grund fuer requires-python <3.14 oben.
    "gensim>=4.4.0",
]

# de-core-news-md aus dem ordner assets installieren
[tool.uv.sources]
de-core-news-md = { path = "assets/de_core_news_md-3.8.0-py3-none-any.whl" }